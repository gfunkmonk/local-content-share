name: Delete workflow runs

on:
  schedule:
    - cron: '0 2 * * *'   # 02:00 UTC daily
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only log actions, do not delete anything.'
        type: boolean
        default: true
        required: false
      days:
        description: 'Retain runs newer than this many days.'
        required: true
        default: '30'
      minimum_runs:
        description: 'Minimum runs to keep per workflow.'
        required: true
        default: '2'
      delete_workflow_pattern:
        description: 'Workflow name/filename to target (leave blank for all).'
        required: false
      delete_run_by_conclusion_pattern:
        description: 'Delete runs by conclusion status.'
        required: true
        default: 'All'
        type: choice
        options:
          - 'All'
          - action_required
          - cancelled
          - failure
          - skipped
          - success
      delete_workflow_by_state_pattern:
        description: 'Delete workflows by state.'
        required: true
        default: 'All'
        type: choice
        options:
          - 'All'
          - active
          - deleted
          - disabled_inactivity
          - disabled_manually

jobs:
  del_runs:
    runs-on: ubuntu-latest
    permissions:
      actions: write      # required to delete workflow runs
      contents: read

    steps:
      - name: Scheduled delete
        if: github.event_name != 'workflow_dispatch'
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          retain_days: 1
          keep_minimum_runs: 4
          delete_workflow_by_state_pattern: 'All'
          delete_run_by_conclusion_pattern: 'All'

      - name: On-demand delete
        if: github.event_name == 'workflow_dispatch'
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          retain_days: ${{ github.event.inputs.days }}
          keep_minimum_runs: ${{ github.event.inputs.minimum_runs }}
          delete_workflow_pattern: ${{ github.event.inputs.delete_workflow_pattern }}
          delete_workflow_by_state_pattern: ${{ github.event.inputs.delete_workflow_by_state_pattern }}
          delete_run_by_conclusion_pattern: ${{ github.event.inputs.delete_run_by_conclusion_pattern }}
          dry_run: ${{ github.event.inputs.dry_run }}
