name: Build Test

on:
  workflow_dispatch:
    inputs:
      delivery_type:
        description: 'Choose build output target'
        required: true
        default: 'Artifact'
        type: choice
        options:
          - 'Artifact'
          - 'Release'

permissions:
  contents: write
  packages: write

jobs:
  check-commit:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.new_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine Version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LATEST_TAG=$(gh release list -L 1 | cut -f 1 | sed 's/Release //' || echo "v0")
          LATEST_TAG=${LATEST_TAG:-v0}
          VERSION=$(echo "$LATEST_TAG" | sed 's/v//')
          NEW_VERSION="v$((VERSION + 1))"
          echo "Previous version: $LATEST_TAG"
          echo "New version:      $NEW_VERSION"
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Create Release
        if: inputs.delivery_type == 'Release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.new_version }}" \
            --title "Release ${{ steps.version.outputs.new_version }}" \
            --draft \
            --notes "Local Content Share latest release binaries." \
            --target "${{ github.sha }}"

  build:
    needs: check-commit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux
          - { os: linux,   arch: amd64                }

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'

      - name: Build Binary
        run: |
          ARM_SUFFIX=""
          if [ -n "${{ matrix.goarm }}" ]; then
            ARM_SUFFIX="v${{ matrix.goarm }}"
          fi

          EXT=""
          if [ "${{ matrix.os }}" = "windows" ]; then
            EXT=".exe"
          fi

          BINARY_NAME="local-content-share-${{ matrix.os }}-${{ matrix.arch }}${ARM_SUFFIX}${EXT}"

          GOOS=${{ matrix.os }} GOARCH=${{ matrix.arch }} GOARM=${{ matrix.goarm }} \
            go build -ldflags="-s -w" -trimpath -o "$BINARY_NAME"

          echo "BINARY_NAME=$BINARY_NAME" >> "$GITHUB_ENV"

      - name: Upload Release Asset
        if: inputs.delivery_type == 'Release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ needs.check-commit.outputs.version }}" "${{ env.BINARY_NAME }}"

      - name: Upload Artifact
        if: inputs.delivery_type == 'Artifact'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.BINARY_NAME }}
          path: ${{ env.BINARY_NAME }}

  publish:
    needs: [check-commit, build]
    if: inputs.delivery_type == 'Release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "${{ needs.check-commit.outputs.version }}" --draft=false